[workspace]
resolver = "3"

[package]
name = "threatflux-string-analysis"
version = "0.2.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["ThreatFlux Team"]
description = "Deterministic, configurable string analysis primitives for security tooling"
license = "MIT"
repository = "https://github.com/ThreatFlux/threatflux-string-analysis"
homepage = "https://github.com/ThreatFlux/threatflux-string-analysis"
documentation = "https://docs.rs/threatflux-string-analysis"
readme = "README.md"
keywords = ["security", "string-analysis", "threat-detection", "forensics", "malware"]
categories = ["security", "text-processing", "algorithms"]
include = [
    "/src/**",
    "/examples/**",
    "/tests/**",
    "/docs/**",
    "/CHANGELOG.md",
    "/CODE_OF_CONDUCT.md",
    "/CONTRIBUTING.md",
    "/DEVELOPMENT.md",
    "/README.md",
    "/SECURITY.md",
    "/TESTING.md",
    "/Cargo.lock",
    "/LICENSE",
]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["now", "serde", "std"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
