version: 2

multi-ecosystem-groups:
  nightly-dependencies:
    schedule:
      interval: cron
      cronjob: "0 5 * * *"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: cargo
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: nightly-dependencies
    cooldown:
      default-days: 7
