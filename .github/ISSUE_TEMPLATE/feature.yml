name: Feature request
description: Propose a focused addition or behavior change.
title: "feature: "
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for this request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the string-analysis use case that is currently difficult or impossible.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Show a small API sketch when possible and note compatibility implications.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or alternative designs.
