name: Bug report
description: Report reproducible incorrect behavior in threatflux-string-analysis.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve threatflux-string-analysis.

  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain sensitive strings or private data.
          required: true

  - type: input
    id: version
    attributes:
      label: Crate version
      placeholder: 0.2.0
    validations:
      required: true

  - type: input
    id: rust
    attributes:
      label: Rust version
      description: Output from `rustc --version --verbose`.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest sanitized Rust example that demonstrates the problem.
      render: rust
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Additional environment details
      description: Include the operating system, target, enabled features, and relevant logs.
