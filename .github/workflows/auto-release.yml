name: Auto Release

concurrency:
  # Dry runs use their own group so a rehearsal never cancels a real release.
  group: auto-release-${{ github.event.workflow_run.head_branch || github.ref_name || 'main' }}${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: true

# workflow_run runs with this repository's secrets, so the release job below
# only acts on a successful push run of CI or Security on this repository's
# main branch (never on a pull request run, including a fork branch named
# main) and the reusable workflow re-checks the conclusion and repository.
# No code from the triggering run is built or executed.
on: # zizmor: ignore[dangerous-triggers] guarded by the job condition below
  workflow_run:
    workflows: [CI, Security]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry_run:
        description: Report the next release without creating a commit, tag, or release
        required: false
        default: false
        type: boolean

# Read-only by default; only the release job gets write scopes.
permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # The reusable release job requests these scopes for GITHUB_TOKEN. With
    # the GitHub App configured, the release commit, tag and GitHub Release
    # are written with a repository-scoped App token instead.
    permissions:
      actions: write # Dispatches release.yml when the release falls back to GITHUB_TOKEN.
      contents: write # Pushes the release commit and tag and creates the GitHub Release.
      pull-requests: write # Required by the reusable release job (release pull request mode).
    uses: ThreatFlux/github_actions/.github/workflows/reusable-auto-release.yml@eb9f3cf78c3899be0c4c9323d5cc86de5e1fdee8 # v0.7.7
    with:
      bump: ${{ github.event.inputs.version_bump || 'auto' }}
      # Only a manual dispatch can request a dry run; workflow_run always releases.
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      required-workflows: CI,Security
      # The threatflux-automation GitHub App cuts the release, so its tag push
      # starts release.yml through the push trigger and the reusable workflow
      # skips the dispatch. release.yml is dispatched only if a release ever
      # falls back to GITHUB_TOKEN, whose tag push starts no workflow.
      dispatch-workflows: release.yml
      github-app-id: ${{ vars.TF_AUTOMATION_APP_ID }}
    secrets:
      github-app-private-key: ${{ secrets.TF_AUTOMATION_APP_PRIVATE_KEY }}
