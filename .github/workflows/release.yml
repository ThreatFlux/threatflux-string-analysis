name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_STABLE: 1.97.1

jobs:
  provenance:
    name: Verify release provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      package_name: ${{ steps.version.outputs.package_name }}
      package_version: ${{ steps.version.outputs.package_version }}
      tag_object: ${{ steps.provenance.outputs.tag_object }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Verify semantic version
        id: version
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag $GITHUB_REF_NAME is not a semantic version" >&2
            exit 1
          fi

          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          package_name="$(jq -er '.packages[] | select(.name == "threatflux-string-analysis") | .name' <<< "$metadata")"
          package_version="$(jq -er '.packages[] | select(.name == "threatflux-string-analysis") | .version' <<< "$metadata")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match ${package_name} ${package_version}" >&2
            exit 1
          fi

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Verify annotated tag is on main
        id: provenance
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "$tag_ref")" != "tag" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must be annotated" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-list -n 1 "$tag_ref")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release commit $tag_commit is not reachable from origin/main" >&2
            exit 1
          fi

          tag_object="$(git rev-parse "$tag_ref")"
          remote_tag_object="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$remote_tag_object" || "$remote_tag_object" != "$tag_object" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} changed during provenance verification" >&2
            exit 1
          fi
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"

      - name: Verify version is unpublished
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        shell: bash
        run: |
          crate_data="$(curl --fail --silent --show-error --retry 3 \
            --user-agent "ThreatFlux-string-analysis-release/${GITHUB_RUN_ID}" \
            "https://crates.io/api/v1/crates/${PACKAGE_NAME}")"
          if ! jq -e '.versions | type == "array"' <<< "$crate_data" >/dev/null; then
            echo "crates.io returned an unexpected response for ${PACKAGE_NAME}" >&2
            exit 1
          fi
          if jq -e --arg version "$PACKAGE_VERSION" \
            '.versions | any(.num == $version)' <<< "$crate_data" >/dev/null; then
            echo "${PACKAGE_NAME} ${PACKAGE_VERSION} is already published on crates.io" >&2
            exit 1
          fi

  verify:
    name: Verify release (${{ matrix.os }})
    needs: provenance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}

      - name: Test release build
        run: cargo test --release --all-targets --all-features --locked

  publish:
    name: Package and publish to crates.io
    needs: [provenance, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/threatflux-string-analysis
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy, rustfmt

      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Record package contents
        env:
          PACKAGE_NAME: ${{ needs.provenance.outputs.package_name }}
        shell: bash
        run: |
          mkdir -p target
          cargo package --list --locked --package "$PACKAGE_NAME" \
            > target/package-contents.txt

      - name: Recheck immutable release tag
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.provenance.outputs.tag_object }}
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          remote_tag_object="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$remote_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} changed or disappeared after verification" >&2
            exit 1
          fi

      - name: Recheck unpublished version
        env:
          PACKAGE_NAME: ${{ needs.provenance.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.provenance.outputs.package_version }}
        shell: bash
        run: |
          crate_data="$(curl --fail --silent --show-error --retry 3 \
            --user-agent "ThreatFlux-string-analysis-release/${GITHUB_RUN_ID}" \
            "https://crates.io/api/v1/crates/${PACKAGE_NAME}")"
          if ! jq -e '.versions | type == "array"' <<< "$crate_data" >/dev/null; then
            echo "crates.io returned an unexpected response for ${PACKAGE_NAME}" >&2
            exit 1
          fi
          if jq -e --arg version "$PACKAGE_VERSION" \
            '.versions | any(.num == $version)' <<< "$crate_data" >/dev/null; then
            echo "${PACKAGE_NAME} ${PACKAGE_VERSION} was published during release validation" >&2
            exit 1
          fi

      - name: Request a crates.io trusted-publishing token
        id: crates-io
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
          PACKAGE_NAME: ${{ needs.provenance.outputs.package_name }}
        shell: bash
        run: |
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "Neither crates.io trusted publishing nor the release-token fallback is configured" >&2
            exit 1
          fi
          cargo publish --locked --package "$PACKAGE_NAME"

      - name: Stage published package
        env:
          PACKAGE_NAME: ${{ needs.provenance.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.provenance.outputs.package_version }}
        shell: bash
        run: |
          mkdir -p release-artifacts
          package="release-artifacts/${PACKAGE_NAME}-${PACKAGE_VERSION}.crate"
          crate_data="$(curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --user-agent "ThreatFlux-string-analysis-release/${GITHUB_RUN_ID}" \
            "https://crates.io/api/v1/crates/${PACKAGE_NAME}")"
          checksum="$(jq -er --arg version "$PACKAGE_VERSION" \
            '.versions[] | select(.num == $version and .yanked == false) | .checksum' \
            <<< "$crate_data")"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --user-agent "ThreatFlux-string-analysis-release/${GITHUB_RUN_ID}" \
            --output "$package" \
            "https://crates.io/api/v1/crates/${PACKAGE_NAME}/${PACKAGE_VERSION}/download"
          cp target/package-contents.txt release-artifacts/
          cd release-artifacts
          printf '%s  %s\n' "$checksum" "${PACKAGE_NAME}-${PACKAGE_VERSION}.crate" \
            > "${PACKAGE_NAME}-${PACKAGE_VERSION}.crate.sha256"
          sha256sum --check "${PACKAGE_NAME}-${PACKAGE_VERSION}.crate.sha256"

      - name: Upload published package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate-package
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Create GitHub release
    needs: [provenance, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck immutable release tag
        env:
          EXPECTED_TAG_OBJECT: ${{ needs.provenance.outputs.tag_object }}
        shell: bash
        run: |
          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          remote_tag_object="$(git ls-remote --tags origin "$tag_ref" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$EXPECTED_TAG_OBJECT" || "$remote_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} changed or disappeared after publication" >&2
            exit 1
          fi

      - name: Download crate package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-package
          path: dist

      - name: Verify package checksum
        shell: bash
        run: |
          cd dist
          sha256sum --check ./*.crate.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.crate
            dist/*.crate.sha256
            dist/package-contents.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          name: ThreatFlux String Analysis ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          tag_name: ${{ github.ref_name }}
